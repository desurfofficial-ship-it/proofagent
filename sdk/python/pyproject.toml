[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proofagent"
version = "0.1.0"
description = "ProofAgent SDK — make AI actions provable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
]
[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42"]


[tool.setuptools.packages.find]
where = ["."]
include = ["proofagent*"]
