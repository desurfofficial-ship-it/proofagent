services:
  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - apidata:/data
    environment:
      - PROOFAGENT_ENV=dev
      - PROOFAGENT_DATA=/data
    # Postgres ready for later swap (API still in-memory in v0 slice)
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proofagent
      POSTGRES_PASSWORD: proofagent
      POSTGRES_DB: proofagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofagent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  apidata:
  pgdata:
