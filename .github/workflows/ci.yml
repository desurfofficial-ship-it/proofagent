name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build API
        run: go build -o /tmp/proofagent-api ./services/api/

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: pip install -e "sdk/python[dev]"
      - name: Import check
        run: python -c "from proofagent import Agent, Client; print('ok')"

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build TS SDK
        working-directory: sdk/typescript
        run: npm install && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build and e2e
        run: |
          go build -o /tmp/proofagent-api ./services/api/
          DEMO_MODE=1 /tmp/proofagent-api &
          sleep 1
          DEMO_MODE=1 ./scripts/e2e.sh
          DEMO_MODE=1 ./scripts/adversarial.sh
